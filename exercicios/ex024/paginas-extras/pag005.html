<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <a href="#" onclick="clicar()">Clique em mim</a>
    <div id="saida"></div>
    <script>
        const clicar = ()=> {
            let saida = document.getElementById("saida")
            
            saida.innerHTML += 'Clicou ✅ <br>'
        }
    </script>
</body>
</html>
