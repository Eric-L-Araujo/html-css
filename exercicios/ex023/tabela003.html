<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-radius: 10px;
            width: 500px;
            
            border-collapse: collapse;
        }

        tr td {
            padding: 15px;
            border: 1px solid gray;
            text-align: center;
        }
    </style>
    <title>Tabelas</title>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>
        <tr>
            <td rowspan="2">D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            
            <td colspan="2">H</td>
            
        </tr>
        <tr>
            
            <td colspan="2">K</td>
            <td>L</td>
        </tr>
    </table>
</body>
</html>
