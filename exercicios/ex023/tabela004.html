<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
      body {
         font-family: Arial, Helvetica, sans-serif;
         font-size: 18px;
      }

      table {
         width: 650px;
         border: 1px solid gray;
         border-collapse: collapse;
         text-align: center;
      }

      td {
         padding: 10px;
         border: 1px solid gray;
      }

      th {
         background-color: rgb(158, 101, 211);
         color: white;
         padding: 10px;
         border: 1px solid rgb(255, 255, 255);
      }

      tr {
         border: 1px solid gray;
      }

   </style>
   <title>Exemplo de tabela </title>
</head>
<body>
   <table>
      <tr>
         <th scope="col">Grupo</th>
         <th scope="col">Nomes</th>
         <th colspan="3" scope="colgroup">Filmes</th>
      </tr>
      <tr>
         <th rowspan="3" scope="rowgroup">Mulheres</th>
         <td>Ana Beatriz Santos</td>
         <td>Alien</td>
         <td>Rambo</td>
         <td>Vingadores</td>
      </tr>
      <tr>
         <td>Beatriz Souza</td>
         <td>Hulk</td>
         <td>Inception</td>
         <td>Batman</td>
      </tr>
      <tr>
         <td>Cláudia Melo</td>
         <td>Oblivion</td>
         <td>Matriz</td>
         <td>Big Hero</td>
      </tr>

      <tr>
         <th rowspan="3" scope="rowgroup">Homens</th>
         <td>Bruno mendonça</td>
         <td>Intocáveis</td>
         <td>Amnésia</td>
         <td>Gladiador</td>
      </tr>
      <tr>
         <td>Daniel Lourenço</td> 
         <td>Wall-E</td>
         <td>Oldboy</td>
         <td>Dangal</td> 
      </tr>
      <tr>
           <td>Fabiano Mota</td>
           <td>Star Wars 5</td>
           <td>Taxi Driver</td>
           <td>Toy Story</td>
      </tr>
    
         
      
   </table>
</body>
</html>
