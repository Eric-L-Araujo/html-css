<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
      body {
         font-size: 18px;
         font-family: Arial, Helvetica, sans-serif;
      }

      table {
         border: 1px solid grey;
         padding: 10px;
         width: 600px;
         text-align: center;
         border-collapse: collapse;
      }

      th {
         color: aliceblue;
         background-color: rgb(109, 108, 108);
         border: 1px solid rgb(0, 0, 0);
      }

      .media {
   
         color: aliceblue;
         background-color: rgb(109, 108, 108);
         border: 1px solid rgb(0, 0, 0);
         text-align: left;
      }

      .media td {
         
         text-align: center;
      }

      td {
         border: 1px solid grey;
         
      }

      col.area {
         background-color: rgb(1, 1, 255);
      }

      col.disciplina {
         background-color: rgb(49, 49, 247);
      }


   </style>
   <title>Desafios da tabela 2</title>
</head>
<body>
   <table>
      <colgroup>
      <col class="area">
      <col class="disciplina">
      <col class="notas">
      <col class="medias">
      </colgroup>
      <caption>Tabela de médias</caption>
      <thead>
         <tr>
            <th rowspan="2" scope="col">Área</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Medias</th>
         </tr>
         <tr>
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
         </tr>
      </thead>
      <tbody>
         
         <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr>
            <td>Fisica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr class="media">
            <th colspan="4" scope="row">Média de Exatas</th>
            <td>0.0</td>
         </tr>
         <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
         </tr>
         <tr class="media">
            <th colspan="4" scope="row" >Média de Humanas</th>
            <td>0.0</td>
         </tr>
      </tbody>
   </table>
</body>
</html>
