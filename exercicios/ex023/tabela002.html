<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table {
            width: 400px;
            padding: 10px;
            text-align: center;
            border-collapse: collapse;
        }

        thead {
            background-color: rgb(175, 175, 175);
            border: 1px solid gray;
        }

        td, th {
            border: 1px solid gray;
             padding: 10px;
        }
    </style>
    <title>Exercício de Tabelas</title>
</head>
<body>
  

    <h1>Uso de tabelas grandes</h1>
    <h2>População por estados do Brasil, 2025</h2>
    <!-- ANATOMIA PARA TABELAS GRANDES
        TABLE
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->
    <table>
        <thead>
            <tr>
                <th scope="col" style="width: 20px;">Posição</th>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
            
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>São Paulo</td>
                <td>46 081 801</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Minas Gerais</td>
                <td>21 393 441</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Rio de Janeiro</td>
                <td>17 223 547</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row">Total de Habitantes</th>
            <td>00000000</td>
        </tfoot>
    </table>
</body>
</html>
